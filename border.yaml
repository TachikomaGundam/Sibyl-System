# Sibyl gate config — DRAFT for owner signature (2026-10-04, seat abathur).
# Model: border's own dogfood config (version 1; every suppression is an
# explicit allow entry that shows in the report's allow-hits — nothing hidden).
version: 1

targets:
  git:
    remotes:
      - { name: origin, url: "git@github.com:TachikomaGundam/Sibyl-System.git" }

rules:
  authors:
    # Single sanctioned identity, matching every commit/tagger seen in
    # `git log --format=%ae | sort -u` for this repo (owner GitHub noreply).
    emails:
      - "TachikomaGundam@users.noreply.github.com"
      # Owner-signed 2026-11-08. Exact pair (this email + name GitHub below) admits
      # exactly ONE identity: GitHub <noreply@github.com>, the web-merge author of
      # 6747e8f, already public at origin/main tip. Workaround for a KNOWN border
      # push-path defect (counts already-public objects as transmitted; ticket open)
      # - REVISIT AND REMOVE once border fix lands. Council vote sibyl-20261108T085732Z-dfdc
      # 3A/0R; author-field laundering risk explicitly accepted, recorded in this entry.
      - "noreply@github.com"
    names:
      - "TachikomaGundam"
      - "GitHub"
  hosts: []
  ips: []
  pathPatterns:
    - "<home>/workspace/harness/Sibyl"
  maxFileKB: 500

allow:
  # Repo-self path detector by name, never hiding secrets.
  - { rule: "path-pattern:<home>/workspace/harness/Sibyl", match: "*" }
  # Test corpus is synthetic by design: planted fake keys (ABCD..7890),
  # bot@.local ssh-shapes, regex assertion sources.
  - { rule: "*", match: "*", file: "test/**" }
  # Exam scenario/bell fixtures are regex/path corpora — same construction.
  - { rule: "*", match: "*", file: "scenarios/**" }
  # The tool's OWN signal-regex source legitimately contains the shapes it hunts.
  - { rule: "*", match: "*", file: "src/exam/**" }
  # The tool's own voter-gate regex source contains the shapes it hunts (line 31).
  - { rule: "*", match: "*", file: "src/tools/consult.ts" }
  # Gate config necessarily names the machine path it guards (self-detection, not a secret).
  - { rule: "*", match: "*", file: "border.yaml" }
  # The push gate's OWN v1.5.0 tag-body hygiene regexes necessarily contain the
  # shapes they hunt (home-path + Windows-path literals in the refusal rules).
  # Same self-detection class as the consult.ts entry above.
  - { rule: "*", match: "*", file: "scripts/git-hooks/pre-push" }
  # Internal working evidence (.gitignore'd, in ZERO commits — probed 2026-11-08:
  # `git ls-files .omo` = 0, absent from HEAD and origin/main trees). Hit classes
  # sampled same-day: "Generic API Key" fires on run-record digest fields
  # ("key"/"head"/"rulesHash": sha256/hex values — the 40-hex FP class on record
  # in the machine wiki ops/dev-env-pitfalls); ssh-target fires on synthetic
  # fixture identities (poc@sibyl.local, bot@default.local). Zero real
  # credentials in sampled files; these paths can never reach a push.
  - { rule: "*", match: "*", file: ".omo/**" }
