name: ci

# push/PR gate (2026-10-23 owner-approved release round, third-party audit MEDIUM:
# main had no automatic gate; the publish workflow was the only CI touch). Runs the
# same five offline doors as the local ship.sh — one source for the gate script
# (L-SINGLE-SOURCE), plus npm audit at high: the toml<=5.0.0 advisory chain that
# shipped green in 1.3.6 is exactly what this step exists to catch on arrival.
# v1.6.0: actions SHA-pinned (I3); installs never run dependency scripts (I4).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./ship.sh
      - run: npm run coverage
      - run: npm audit --audit-level=high
