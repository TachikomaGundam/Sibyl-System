name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
  actions: read # the liveness gate reads the scheduled-audit run history
jobs:
  npm-oidc:
    runs-on: ubuntu-latest
    steps:
      # v1.6.0 seating: SHA-pinned actions (I3); no dependency install scripts (I4);
      # server-side liveness gate (S1/S2) — publish refuses without a fresh green
      # scheduled audit bound to THIS commit. Gate self-deletion is answered by
      # EXTERNAL anchors (branch protection + border cross-rule), see OPEN-VECTORS.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Server-side W4 echo (98f3 audit blocker, 2026-11-03): the local hook's
      # paperwork — tag/version parity + release receipt with a literal
      # `gate: PASS` — re-runs HERE, where --no-verify cannot reach.
      - name: tag paperwork (parity + receipt)
        env:
          TAG_REF: ${{ github.ref_name }}
        run: node scripts/tag-paperwork.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # npm Trusted Publishing (OIDC, tokenless) REQUIRES npm >= 11.5.1 — the
      # runner-bundled npm 10.x cannot (the ENEEDAUTH lesson of tag b96369e,
      # 2026-11-02). Pinned exact: updates happen only via reviewed commits
      # (this file is gate-territory; dependabot does not float this constant).
      - run: npm install -g --ignore-scripts npm@11.21.1
      - name: wall clock for the causal tie (H1)
        # 2026-11-12 first-real-run defect: `github.run_started_at` is not a
        # workflow context property — it rendered EMPTY on the v2.0.0 publish
        # (run 43253933134) and publish-gate fail-closed on the unparseable
        # value, exactly as its law demands. The unit tests always fed env
        # directly, so the expression itself was never exercised until then.
        # The job-start clock is at-or-after the run start the original design
        # intended, so the default-branch causal branch stays equal-or-tighter.
        id: clock
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: supply-chain liveness gate (S1/S2) + release-day auto-witness (H1)
        # Auto-witness (council-2-alt, 2026-11-08): the tag push above also
        # triggered scheduled-audit.yml on THIS commit; the gate now WAITS for
        # a green audit causally tied to this tag — head_sha exact, and either
        # the push run whose head_branch is this tag name, or a default-branch
        # run created at/after this publish run began (which is after the tag
        # ref existed). Cadence is explicit and bounded: poll every 30s, hard
        # 20-minute bound (measured audit wall time 12-35s per run history —
        # >34x margin; rationale recorded in test/publish-gate.test.ts).
        # Past the bound the gate FAILS with an ::error:: annotation — a
        # timeout is a loud refusal, never silence (the v1.6.3 lesson).
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          TAG_REF: ${{ github.ref_name }}
          TAG_REF_CREATED_AT: ${{ steps.clock.outputs.ts }}
        run: node scripts/publish-gate.mjs --workflow scheduled-audit.yml --poll-seconds=30 --wait-minutes=20
      - run: npm ci --ignore-scripts
      - run: ./ship.sh
      - run: npm audit --audit-level=high
      - run: npm publish --provenance
